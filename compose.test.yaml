# Isolated integration database only; contains no production connection settings.
services:
  database:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
